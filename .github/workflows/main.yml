name: Build Project Aurora VST3

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: windows-latest
timeout-minutes: 45

steps:
  - name: Checkout Project Aurora
    uses: actions/checkout@v4

  - name: Install CMake
    uses: lukka/get-cmake@latest

  - name: Download JUCE
    uses: actions/checkout@v4
    with:
      repository: juce-framework/JUCE
      path: JUCE

  - name: Configure project
    shell: pwsh
    run: |
      cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_DIR=$env:GITHUB_WORKSPACE/JUCE"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - name: Build VST3 with one worker
    shell: pwsh
    run: |
      cmake --build build --config Release --target ProjectAurora_VST3 -- /m:1
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - name: Run tests
    shell: pwsh
    run: |
      ctest --test-dir build -C Release --output-on-failure
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  - name: Locate VST3
    shell: pwsh
    run: |
      $plugin = Get-ChildItem build -Recurse -Directory -Filter "*.vst3" |
        Where-Object { $_.FullName -match "Release" } |
        Select-Object -First 1

      if (-not $plugin) {
        throw "Nessun bundle VST3 trovato."
      }

      "PLUGIN_PATH=$($plugin.FullName)" >> $env:GITHUB_ENV

  - name: Upload VST3 artifact
    uses: actions/upload-artifact@v4
    with:
      name: ProjectAurora-VST3-Windows
      path: ${{ env.PLUGIN_PATH }}
      if-no-files-found: error
      retention-days: 14
